name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - improve-production-readiness
      - fix/production-hardening-and-types

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit smoke tests
        run: npm run test:upload

      - name: Build
        env:
          PINATA_JWT: test-placeholder
          META_API_KEY: test-placeholder
          META_API_URL: https://api.meta.global/v1
          NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB: 5
        run: npm run build
